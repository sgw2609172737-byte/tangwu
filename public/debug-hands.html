<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>手势调试</title>
<style>
  body { background: #1a1d38; margin: 0; padding: 16px; font-family: sans-serif; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .cell { background: #252a52; border: 1px solid #444; border-radius: 8px; text-align: center; }
  .cell svg.hand { width: 220px; height: 210px; }
  .cell .n { color: #fff; font-size: 18px; font-weight: 800; padding: 2px; }
</style>
</head>
<body>
<div class="row" id="hands"></div>
<script src="ui.js"></script>
<script>
const el = document.getElementById('hands');
for (let d = 0; d <= 11; d++) {
  el.innerHTML += '<div class="cell">' + handSVG(d) + '<div class="n">' + d + '</div></div>';
}
</script>
</body>
</html>
