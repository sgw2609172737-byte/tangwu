<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>唐五 · 本地版</title>
<link rel="stylesheet" href="style.css">
<style>
  body { min-height: 100vh; }
  #menu { width: 100%; max-width: 480px; }
  .menu-opt { display: flex; flex-direction: column; gap: 14px; margin-top: 8px; }
  .seg { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .seg button.on { background: linear-gradient(135deg, #4c5fd5, #7a5fd0); border-color: #8b7ae0; font-weight: 600; }
  #diff-row { display: flex; align-items: center; gap: 8px; justify-content: center; color: var(--dim); font-size: 14px; }
  #game { display: flex; flex-direction: column; gap: 10px; flex: 1; min-height: 0; }
  .controls-local { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 14px 18px; backdrop-filter: blur(8px); }
</style>
</head>
<body>
<header>
  <div class="logo">🖐 唐五 · 本地版</div>
  <div class="roominfo" id="subinfo">单机 · 无需联网</div>
  <div class="header-btns"><button id="btn-back" class="ghost hidden">🏠 菜单</button></div>
</header>

<main>
  <!-- 菜单 -->
  <section id="menu" class="panel">
    <h2>选择模式</h2>
    <p class="sub">本地单机，无需联网、无需服务器</p>
    <div class="menu-opt">
      <div class="seg" id="mode-seg">
        <button data-mode="pve" class="on">🤖 人机对战</button>
        <button data-mode="pvp">👥 本地双人</button>
        <button data-mode="ai">🖥 AI 观战</button>
      </div>
      <div id="diff-row">
        <span>AI 难度：</span>
        <div class="seg" id="diff-seg">
          <button data-diff="easy">简单</button>
          <button data-diff="normal" class="on">普通</button>
          <button data-diff="hard">困难</button>
        </div>
      </div>
      <button id="btn-start" class="primary">开始对局</button>
      <button id="btn-online" class="ghost">🌐 线上联机</button>
    </div>
    <p class="hint" style="margin-top:14px">规则：先手 20 血 / 后手 21 血，能量→费用，详见「规则手册」</p>
  </section>

  <!-- 对局 -->
  <section id="game" class="hidden">
    <div class="game-left">
      <div id="turn-banner" class="banner"></div>
      <div class="player-card" id="p0-card"></div>
      <div class="player-card" id="p1-card"></div>
      <div id="controls" class="controls-local"></div>
    </div>
    <div class="game-right">
      <div id="log" class="log"></div>
    </div>
  </section>
</main>

<div id="result-modal" class="modal hidden">
  <div class="modal-box">
    <h2 id="result-title"></h2>
    <div id="result-sub" class="sub"></div>
    <button id="btn-again" class="primary">🔁 再来一局</button>
    <button id="btn-menu" class="ghost">🏠 返回菜单</button>
  </div>
</div>

<div id="toast" class="toast hidden"></div>
<div id="ai-thinking" class="ai-thinking hidden">🤖 AI 思考中<span class="dot"></span><span class="dot"></span><span class="dot"></span></div>

<script src="../skills.js"></script>
<script src="../engine.js"></script>
<script src="../ai.js"></script>
<script src="ui.js"></script>
<script src="local.js"></script>
</body>
</html>
