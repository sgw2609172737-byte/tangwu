<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>唐五 · 联机对战</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="logo">🖐 唐五</div>
  <div class="roominfo" id="roominfo"></div>
  <div class="header-btns">
    <button id="btn-rules" class="ghost">📖 规则</button>
    <button id="btn-leave" class="ghost hidden">🚪 退出</button>
  </div>
</header>

<main>
  <!-- 大厅 -->
  <section id="lobby" class="panel hidden">
    <h2>进入对局</h2>
    <p class="sub">双人联机 · 或单人挑战 AI · 先手20血 / 后手21血</p>
    <div class="join-row">
      <input id="name-input" placeholder="你的昵称" maxlength="12">
      <button id="btn-create" class="primary">创建房间</button>
    </div>
    <div class="join-row">
      <input id="code-input" placeholder="房间码（4位）" maxlength="4" autocomplete="off">
      <button id="btn-join" class="primary">加入房间</button>
    </div>
    <div class="join-row">
      <select id="ai-diff" title="AI 难度">
        <option value="easy">AI 简单</option>
        <option value="normal" selected>AI 普通</option>
        <option value="hard">AI 困难</option>
      </select>
      <button id="btn-create-ai" class="primary">🤖 对战 AI</button>
    </div>
    <div id="lobby-err" class="err"></div>
  </section>

  <!-- 等待 -->
  <section id="waiting" class="panel hidden">
    <h2>等待对手加入…</h2>
    <div class="bigcode" id="bigcode"></div>
    <div class="sub">把这个链接发给朋友，<b>朋友点开即玩，无需任何操作</b>：</div>
    <div class="invite"><a id="invite-link" href="#" target="_blank"></a> <button id="btn-copy">复制链接</button></div>
    <div class="hint">对方打开链接会自动加入并开局（先手随机，先手20血/后手21血）</div>
  </section>

  <!-- 对局 -->
  <section id="game" class="hidden">
    <div class="game-left">
      <div id="turn-banner" class="banner"></div>
      <div class="player-card" id="opp-card"></div>
      <div class="player-card" id="me-card"></div>
      <div id="controls" class="controls"></div>
    </div>
    <div class="game-right">
      <div id="log" class="log"></div>
    </div>
  </section>
</main>

<!-- 结果弹窗 -->
<div id="result-modal" class="modal hidden">
  <div class="modal-box">
    <h2 id="result-title"></h2>
    <div id="result-sub" class="sub"></div>
    <button id="btn-rematch" class="primary">🔁 再来一局</button>
    <div id="rematch-hint" class="hint"></div>
  </div>
</div>

<!-- 规则弹窗 -->
<div id="rules-modal" class="modal hidden">
  <div class="modal-box wide">
    <div class="modal-head"><h2>📖 规则手册</h2><button id="btn-rules-close" class="ghost">✕</button></div>
    <iframe src="rules.html" title="规则手册"></iframe>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="ui.js"></script>
<script src="app.js"></script>
</body>
</html>
