<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>唐五 UI 预览</title>
<link rel="stylesheet" href="style.css">
<style>
  body { padding: 26px; display: block; }
  h1 { margin-bottom: 6px; }
  .section { margin: 22px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .row { display: flex; flex-wrap: wrap; gap: 16px; }
  .grid-preview { display: grid; grid-template-columns: repeat(auto-fill, minmax(185px, 1fr)); gap: 10px; }
  .demo-card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; align-items: center; gap: 12px; }
</style>
</head>
<body>
<h1>🖐 唐五 UI 预览</h1>
<div class="hint">手势 0–11（费用手蓝徽章 / 技能手紫徽章）</div>
<div class="section"></div>
<div class="row" id="hands"></div>
<div class="section">对局界面（模拟）</div>
<section id="game">
  <div class="player-card" id="mock-opp"></div>
  <div class="mid">
    <div class="banner myturn">🎯 你的回合</div>
    <div class="log" id="mock-log"></div>
  </div>
  <div class="player-card active" id="mock-me"></div>
  <div class="controls" id="mock-controls"></div>
</section>
<div class="section">全部技能卡牌</div>
<div id="groups"></div>
<script src="ui.js"></script>
<script>
const groups = [{"d":"0","skills":[{"id":"danxiao","name":"氮笑","desc":"+1$","star":false,"isDigit":false},{"id":"jinghua","name":"净化","desc":"+1血；解除自身所有延迟/持续伤害；七步：第1次降为-3，第2次解除","star":false,"isDigit":false},{"id":"jiaren","name":"假人","desc":"获得1血假人（第二条命）；全局限1次（假人唐化可无限次，同时上限1）","star":false,"isDigit":false},{"id":"jiarenqh","name":"假人强化","desc":"假人+2血（假人作战状态下无法使用）","star":false,"isDigit":false}]},{"d":"1","skills":[{"id":"xiao","name":"笑","desc":"获得2点费用","star":false,"isDigit":false},{"id":"quan","name":"拳","desc":"对对方造成2点伤害","star":false,"isDigit":false},{"id":"yi","name":"一","desc":"数字技能：获得再次行动","star":false,"isDigit":true},{"id":"tao","name":"桃","desc":"回复1点生命（受强化影响：+3）","star":true,"isDigit":false}]},{"d":"2","skills":[{"id":"huanwu","name":"幻雾","desc":"+1$；对方下回合跳过技能手相加","star":false,"isDigit":false},{"id":"huifu","name":"回复术士","desc":"回复2点生命（受强化影响：+4）","star":true,"isDigit":false},{"id":"jingji","name":"荆棘","desc":"下次受到伤害时，反弹⌈n/2⌉给伤害来源（一次性）","star":false,"isDigit":false},{"id":"chaofeng","name":"嘲讽","desc":"对方下回合对你造成的伤害n<4时，你对对方造成(4-n)伤害","star":false,"isDigit":false}]},{"d":"3","skills":[{"id":"xiaolieyan","name":"小烈焰","desc":"立即3伤；你下回合开始时再自动造成2伤（可被净化）","star":false,"isDigit":false},{"id":"san","name":"三","desc":"数字技能：+2$，获得再次行动","star":false,"isDigit":true},{"id":"hanfeng","name":"寒风","desc":"3伤并使对方-1$","star":false,"isDigit":false},{"id":"tanghua","name":"假人唐化","desc":"永久：可无限次使用【假人】（同时最多1个）","star":false,"isDigit":false}]},{"d":"4","skills":[{"id":"xiaoxiaotou","name":"小小偷","desc":"对方-4$（最低0）并造成1伤","star":false,"isDigit":false},{"id":"dian24","name":"24点","desc":"四手数字各用一次、加减乘除算出24 → +5血（强化+7）；算不出则空放","star":true,"isDigit":false},{"id":"yizhanyangzhan","name":"以战养战","desc":"按本局累计伤害n结算：n≥5/10/15各+2$（最多+6）","star":false,"isDigit":false},{"id":"si","name":"四","desc":"数字技能：+3$，获得再次行动","star":false,"isDigit":true},{"id":"cuidu","name":"淬毒","desc":"永久：你的攻击类技能附带下回合1伤（毒伤不受增伤加成，可被净化）","star":false,"isDigit":false}]},{"d":"5","skills":[{"id":"shangjin","name":"赏金","desc":"5伤，并按本回合已造成伤害n的⌈n/3⌉获得费用（含本次5伤）","star":false,"isDigit":false},{"id":"touzi","name":"投资","desc":"费用先+3$再翻倍（封顶11）","star":false,"isDigit":false},{"id":"wudi","name":"无敌","desc":"免疫下次攻击（并+2血）及附带效果；未触发则一直保留","star":false,"isDigit":false}]},{"d":"6","skills":[{"id":"yingneng","name":"盈能","desc":"+1$；此后你每n回合未攻击（n上限6），下次伤害+n（一次性）","star":false,"isDigit":false},{"id":"jiubaK","name":"98K","desc":"9伤；本回合若已连续使用≥3次数字技能（一/三/四/八）且至少2种 → 114514秒杀（无视无敌/荆棘/假人）","star":false,"isDigit":false},{"id":"qianghua","name":"强化","desc":"永久：所有带*技能的加血值+2","star":false,"isDigit":false},{"id":"bing","name":"冰！","desc":"+2血；对方接下来2回合无法行动（只能+1$）","star":false,"isDigit":false}]},{"d":"7","skills":[{"id":"qibu","name":"七步","desc":"对方每回合结束时-4血；被净化1次降为-3，第2次解除；不触发无敌、不受增伤","star":false,"isDigit":false},{"id":"shuangbei","name":"双倍圣水","desc":"此后你每回合额外+1$（可叠加）","star":false,"isDigit":false},{"id":"gongping","name":"公平正义","desc":"+1$；去除对方正面buff共2层（同一buff可扣2层，或两个buff各1层；不足2层有多少去多少）","star":false,"isDigit":false}]},{"d":"8","skills":[{"id":"ba","name":"八","desc":"数字技能：+8$，获得再次行动","star":false,"isDigit":true},{"id":"huxi","name":"呼吸回血","desc":"此后你每回合+1血（可叠加）","star":false,"isDigit":false},{"id":"jijiu","name":"急救箱","desc":"回复10点生命（受强化影响：+12）","star":true,"isDigit":false},{"id":"duming","name":"赌命！","desc":"+4$、+6血并再次行动；6个你的回合（含释放回合）内未分胜负 → 血量清零直接败北（无视假人）；期间：每段伤害+3、攻击技能后+1$、瞬时伤害≥9可再次行动（整局限一次）","star":false,"isDigit":false}]},{"d":"9","skills":[{"id":"youli","name":"尤里","desc":"+4$；你完全控制对方下个回合","star":false,"isDigit":false},{"id":"yuandu","name":"元毒九泉","desc":"10伤，+3血，+2$，对方-2$","star":false,"isDigit":false},{"id":"jidao","name":"极盗","desc":"1伤；对方费用清零，你获得其原费用⌈1/3⌉","star":false,"isDigit":false},{"id":"bishi","name":"鄙视","desc":"永久被动：每回合对方行动前，若你技能手数字>对方，你+1$、对方-1$","star":false,"isDigit":false},{"id":"shipo","name":"识破","desc":"+1血，+6$；对方本体与假人血量互换，再对互换后的本体造成1伤（无假人则互换无效）","star":false,"isDigit":false}]}];
const handsEl = document.getElementById('hands');
for (let d = 0; d <= 11; d++) {
  handsEl.innerHTML += '<div class="hand-box ' + (d % 2 ? 'skill' : 'energy') + '">' + handSVG(d) + '<div class="hand-digit ' + (d % 2 ? 'skill' : 'energy') + '">' + d + '</div></div>';
}
// ---- 对局模拟 ----
function mockPlayer(p, label, ctrl) {
  const buffs = p.buffs.map((b) => '<span class="buff" data-key="' + b[0] + '" title="' + b[2] + '">' + b[1] + '·' + b[2] + '</span>').join('');
  const hpPct = Math.max(0, Math.min(100, (p.hp / 30) * 100));
  const hpCls = p.hp > 15 ? 'good' : (p.hp > 7 ? 'mid' : 'low');
  return '<div class="p-head"><span class="p-name">' + label + ' · ' + p.name + (ctrl ? ' 🧠' : '') + '</span>'
    + '<span class="energy-badge" title="实际费用">费用 ' + p.energy + '$</span></div>'
    + '<div class="hp-row"><div class="hp-bar"><div class="hp-fill ' + hpCls + '" style="width:' + hpPct + '%"></div></div><span class="hp-num">' + p.hp + '</span></div>'
    + '<div class="hands">'
    + '<div class="hand-box energy" title="费用手">' + handSVG(p.e) + '<div class="hand-digit energy">' + p.e + '</div></div>'
    + '<div class="hand-box skill" title="技能手">' + handSVG(p.s) + '<div class="hand-digit skill">' + p.s + '</div></div>'
    + '</div><div class="buffs">' + buffs + '</div>';
}
document.getElementById('mock-opp').innerHTML = mockPlayer({ name: '小明', e: 8, s: 6, hp: 14, energy: 9, buffs: [['qibu', '七步', '每回合-4血'], ['freeze', '冰封', '剩1回合']] }, '对手', false);
document.getElementById('mock-me').innerHTML = mockPlayer({ name: '我', e: 3, s: 6, hp: 19, energy: 11, buffs: [['qianghua', '强化', '永久'], ['wudi', '无敌', '已就绪']] }, '我', false);
document.getElementById('mock-log').innerHTML = [
  ['nrg', '小明 回合开始：费用 +1$（当前 9$）'],
  ['sys', '冰！：小明 被冰封2回合'],
  ['dmg', '小烈焰：对 小明 造成3点伤害'],
  ['heal', '急救箱：回复10点生命'],
  ['sys', '强化生效（永久）'],
].map(([c, t]) => '<div class="log-line ' + c + '">' + t + '</div>').join('');
const mockSkills = groups.find((g) => g.d === '6').skills;
let mc = '<div class="prompt">技能手 = <b>6</b>，费用 <b>6$</b>（当前 11$）</div><div class="skill-grid">';
mockSkills.forEach((sk, i) => { mc += skillCardHTML(sk, 6, true, 'data-mock="' + i + '"'); });
mc += '</div><button class="pass-btn">空过（结束回合）</button>';
document.getElementById('mock-controls').innerHTML = mc;
const gEl = document.getElementById('groups');
for (const g of groups) {
  let cards = '';
  g.skills.forEach((sk, i) => { cards += skillCardHTML(sk, g.d, true, 'data-skill="' + i + '"'); });
  gEl.innerHTML += '<div class="section">数字 ' + g.d + '</div><div class="grid-preview">' + cards + '</div>';
}
</script>
</body>
</html>
